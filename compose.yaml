name: sync-watch-room

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watch_room}
      POSTGRES_DB: ${POSTGRES_DB:-watch_room}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4174
      WS_PATH: /ws
      SERVE_STATIC: "false"
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-5000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      WS_MAX_PAYLOAD_BYTES: ${WS_MAX_PAYLOAD_BYTES:-65536}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://${POSTGRES_USER:-watch_room}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-watch_room}
      SESSION_COOKIE_SECURE: "true"
      MACCMS_SOURCES: ${MACCMS_SOURCES:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PUBLIC_URL: ${OSS_PUBLIC_URL:-}
      STUN_URLS: ${STUN_URLS:-stun:localhost:3478}
      TURN_URLS: ${TURN_URLS:-turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
    volumes:
      - catalog-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  turn:
    build:
      context: .
      dockerfile: docker/turn.Dockerfile
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env}
      TURN_REALM: ${TURN_REALM:-sync-watch-room.local}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_RELAY_IP: ${TURN_RELAY_IP:-}
      TURN_DETECT_EXTERNAL_IP: ${TURN_DETECT_EXTERNAL_IP:-false}
      TURN_MAX_BPS: ${TURN_MAX_BPS:-1048576}
    ports:
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_ICE_SERVERS: ${VITE_ICE_SERVERS:-}
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 4174
    depends_on:
      backend:
        condition: service_healthy
      turn:
        condition: service_started
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8088}:8080"
    restart: unless-stopped

volumes:
  catalog-data:
  postgres-data:
